<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSINCHA Coding Agent</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #111827; color: #e5e7eb; }
    label { display:block; margin-top: .8rem; font-weight: 600; }
    input, textarea, button { box-sizing:border-box; width:100%; margin-top:.35rem; padding:.65rem; border:1px solid #4b5563; border-radius:6px; background:#1f2937; color:inherit; }
    textarea { min-height: 110px; resize: vertical; }
    button { width:auto; cursor:pointer; background:#2563eb; border:0; margin-right:.5rem; }
    button.danger { background:#b91c1c; } button.secondary { background:#4b5563; }
    .row { display:flex; gap:1rem; } .row > * { flex:1; }
    pre { white-space:pre-wrap; background:#030712; padding:1rem; border-radius:6px; overflow:auto; line-height:1.8; }
    #status { margin:1rem 0; color:#93c5fd; }
  </style>
</head>
<body>
  <h1>SSINCHA Coding Agent</h1>
  <p>本页面仅在本机运行。API Key 只提交给本地服务，并保存在当前浏览器标签页，方便刷新后继续使用。</p>
  <label>DeepSeek API Key <input id="key" type="password" autocomplete="off"></label>
  <label>Workspace <input id="workspace" placeholder="D:\\CodingAgent\\project"></label>
  <div class="row"><label>Session 名称 <input id="session" placeholder="demo"></label><div><label>已有会话</label><select id="sessions" style="width:100%;padding:.65rem;margin-top:.35rem"></select></div></div>
  <label>任务指令 <textarea id="task" placeholder="修复测试并运行验证"></textarea></label>
  <p><button id="run">运行任务</button><button id="clear" class="secondary">清空反馈</button><button id="new" class="secondary">新建对话</button><button id="del" class="danger">删除对话</button></p>
  <div id="status"></div><pre id="output">等待任务...</pre>
  <script>
    const $ = id => document.getElementById(id);
    const KEY_STORAGE = 'ssincha.api_key';
    $('key').value = sessionStorage.getItem(KEY_STORAGE) || '';
    $('key').addEventListener('input', () => sessionStorage.setItem(KEY_STORAGE, $('key').value));
    function renderResult(result) {
      if (result.error) { $('output').textContent = '错误：' + result.error; return; }
      const lines = [];
      lines.push(result.exit_code === 0 ? '任务完成' : '任务未完成');
      lines.push('步骤数：' + result.steps);
      for (const item of result.trajectory || []) {
        const type = item.action && item.action.type ? item.action.type : '未知动作';
        let detail = item.success ? '成功' : '失败';
        if (type === 'Execute_Test' && item.success) {
          const match = (item.observation || '').match(/(\d+) passed/);
          if (match) detail += '，' + match[1] + ' passed';
        }
        if (type === 'Stop' && item.success && item.action.params && item.action.params.reason) {
          detail += '（原因：' + item.action.params.reason + '）';
        }
        lines.push(type + '：' + detail);
      }
      const terminalErrors = (result.errors || []).filter(error => !['guardrail', 'test_binding', 'repeated_action', 'breaker'].includes(error.source));
      const warningCount = (result.errors || []).length - terminalErrors.length;
      if (terminalErrors.length) {
        lines.push('错误：' + terminalErrors[0].message);
      } else {
        lines.push(result.exit_code === 0 ? '错误：无' : '错误：任务未完成');
      }
      if (warningCount) lines.push('历史警告：' + warningCount + ' 条');
      $('output').textContent = lines.join('\n');
    }
    async function sessions() { const r=await fetch('/api/sessions'); const d=await r.json(); $('sessions').innerHTML=''; for(const n of d.sessions){const o=document.createElement('option');o.value=n;o.textContent=n;$('sessions').append(o);} }
    $('sessions').onchange=()=>{$('session').value=$('sessions').value;};
    $('clear').onclick=()=>{ $('status').textContent=''; $('output').textContent='等待任务...'; };
    $('new').onclick=async()=>{const name=$('session').value.trim(),workspace=$('workspace').value.trim(); if(!name||!workspace)return alert('请填写 session 和 workspace'); const r=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,workspace})}); const d=await r.json(); $('status').textContent=d.error||'对话已创建'; sessions();};
    $('del').onclick=async()=>{const name=$('session').value.trim(); if(!name||!confirm('删除此对话？'))return; const r=await fetch('/api/sessions/'+encodeURIComponent(name),{method:'DELETE'}); const d=await r.json(); $('status').textContent=d.error||'对话已删除'; sessions();};
    $('run').onclick=async()=>{ $('status').textContent='运行中...'; const body={api_key:$('key').value,workspace:$('workspace').value,task:$('task').value,session:$('session').value||null}; const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const d=await r.json(); $('status').textContent=d.error||'运行结束'; renderResult(d); sessions(); };
    sessions();
  </script>
</body>
</html>

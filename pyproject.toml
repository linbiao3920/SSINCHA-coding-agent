[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssincha-coding-agent"
version = "0.1.0"
description = "A minimal coding agent for the graduate recommendation assessment."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

